<body>

        <!-- Menú de navegación (Requisito) -->

<form id="formulario">

        </br>
</br>

</br>
</br>
<fieldset id="espPass">

</fieldset>
</nav>
</br>
</br>

<button type="submit">Ingresar</button>

<p><a href="registro.html">¿No tienes una cuenta? Crea una cuenta</a></p>
