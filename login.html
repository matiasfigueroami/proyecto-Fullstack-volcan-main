<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesión</title>
    <link rel="stylesheet" href="css/styleLogin.css">
</head>
<body>
<div class="migas"><a href="index.html">← Volver a Inicio</a></div>
<form id="formulario">
    <fieldset id="fieldset1">
        <h2>Inicio de Sesión</h2>
        </br>
</br>
        <nav>
            <fieldset id="espEmail">
    <legend>Email:</legend>
    <input type="email" required id="email" name="email" placeholder="Ingrese Email...">
    <p><a href="">¿Olvidaste tú correo?</a></p">
    </fieldset>
</br>
</br>
<fieldset id="espPass">
    <legend>Contraseña:</legend>
    <input type="password" required id="password" name="password" placeholder="Ingrese  una Contraseña">
    <p><a href="">¿Olvidaste tú contraseña?</a></p">
</fieldset>
</nav>
</br>
</br>

<button type="submit">Ingresar</button>

<p><a href="registro.html">¿No tienes una cuenta? Crea una cuenta</a></p>
    </fieldset>
</form>
    <script src="js/scriptLogin.js"></script>
</body>
</html>
